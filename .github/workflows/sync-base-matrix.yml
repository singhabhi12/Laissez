name: Sync base matrix

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never run two syncs at once; they would race for the same branch.
concurrency:
  group: sync-base-matrix
  cancel-in-progress: false

jobs:
  sync:
    name: Compare with passport-index-dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request opened with the default GITHUB_TOKEN does not trigger
          # other workflows, so CI would never run on it. Set a SYNC_TOKEN secret
          # (a fine-grained PAT or GitHub App token with contents and
          # pull-requests write) to have CI check the sync PR automatically.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Download and compare
        id: sync
        run: npm run data:sync

      # The schema must still accept the merged data. The full test suite is
      # deliberately not run here: golden counts such as "India, no documents:
      # 58" are expected to move when the base matrix does, and that is for a
      # reviewer to judge on the PR, not a reason to drop the update.
      - name: Validate the updated dataset
        if: steps.sync.outputs.changes == 'true'
        run: npm run data:build

      - name: Open pull request
        if: steps.sync.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          TITLE: ${{ steps.sync.outputs.title }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists; a sync for today was already opened."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          # Only the dataset. The summary is the PR body, not a repo file.
          git add data/visa-unlock-dataset.json
          git commit -m "$TITLE"
          git push origin "$BRANCH"

          gh label create data-sync --color 0E8A16 \
            --description "Automated base matrix update" 2> /dev/null || true

          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file base-matrix-summary.md \
            --label data-sync

      - name: Summary
        if: always()
        env:
          CHANGES: ${{ steps.sync.outputs.changes }}
        run: |
          if [ "$CHANGES" = "true" ]; then
            cat base-matrix-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Base matrix already matches passport-index-dataset. Nothing to open." >> "$GITHUB_STEP_SUMMARY"
          fi
